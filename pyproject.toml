[project]
name = "magma_bench"
version = "1.0.0"
description = "Benchmark code to execute and evaluate your model on the MAGMA-BENCHMARK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "magma_core[simulation]>=1.0.0,<2.0.0",
    "magma_scenarios>=1.0.0,<2.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
video = [
    "imageio-ffmpeg>=0.5",
    "numpy>=1.23",
    "Pillow>=10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
