name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'MAGMA-rob/magma-bench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version and public main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("The tag must match the version in pyproject.toml")
          PY
      - name: Build and check package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check installed wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          import os
          from importlib.metadata import version
          import magma_bench

          assert version("magma_bench") == os.environ["GITHUB_REF_NAME"].removeprefix("v")
          PY
          magma-bench --version
          magma-bench run --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/magma-bench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
